version: 2

models:
  - name: products_t
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique
      - name: price
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
  - name: orders_t
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: total_amount
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
